<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel · Portillo Kus &amp; Asociados</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/panel/estilos.css">
  <script type="module" src="/panel/app.js"></script>
</head>
<body>
  <a id="saltar-contenido" class="salto" href="#contenido">Ir al contenido</a>
  <header class="barra">
    <div class="barra-marca">
      <img class="logo" src="/portillo-images/logo.png" alt="Portillo Kus &amp; Asociados" width="150" height="80">
      <button id="menu-movil" class="boton boton-borde menu-movil" type="button" aria-expanded="false" aria-controls="menu" hidden>Secciones</button>
    </div>
    <nav id="menu" class="menu" aria-label="Secciones del panel" hidden></nav>
    <div id="cuenta" class="cuenta" hidden>
      <span id="cuenta-nombre"></span>
      <button id="salir" type="button" class="boton boton-borde">Salir</button>
    </div>
  </header>

  <div class="espacio-trabajo">
    <div id="publicacion" class="publicacion" role="status" aria-live="polite" hidden></div>
    <main id="contenido" class="contenido" tabindex="-1">
      <noscript><p>El panel necesita JavaScript.</p></noscript>
    </main>
  </div>

  <template id="plantilla-login">
    <form id="login" class="tarjeta login" novalidate>
      <h1>Entrar al panel</h1>
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="contrasena">Contraseña</label>
      <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required>
      <p id="login-error" class="aviso-error" role="alert" hidden></p>
      <button type="submit" class="boton">Entrar</button>
    </form>
  </template>
  <template id="plantilla-cambiar-clave">
    <form class="tarjeta login">
      <h1>Elegí tu contraseña</h1>
      <p>Antes de editar, reemplazá la contraseña provisoria. Usá al menos 15 caracteres.</p>
      <label for="clave-nueva">Contraseña nueva</label>
      <input id="clave-nueva" type="password" autocomplete="new-password" minlength="15" maxlength="200" required>
      <label for="clave-confirmada">Repetí la contraseña</label>
      <input id="clave-confirmada" type="password" autocomplete="new-password" required>
      <p class="aviso-error" role="alert" hidden></p>
      <button type="submit" class="boton">Cambiar contraseña</button>
      <button type="button" class="boton boton-borde" data-salir>Salir</button>
    </form>
  </template>
</body>
</html>
